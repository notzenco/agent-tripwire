[package]
name = "agent-tripwire"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Honeytoken credentials that alert when an AI coding agent reads, leaks or uses them"
license = "MIT"
repository = "https://github.com/notzenco/agent-tripwire"
readme = "README.md"
keywords = ["security", "honeytoken", "ai-agents", "canary", "detection"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "tripwire"
path = "src/main.rs"
